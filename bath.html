<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG 바스에어 고객 제안서</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background-color: #1a1a1a; 
            min-height: 100vh; 
            font-family: 'Malgun Gothic', sans-serif; 
        }

        /* 슬라이드 컨테이너 */
        .slider-container { 
            position: relative; 
            width: 100%; 
            max-width: 1200px; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
            background: #000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        /* 개별 슬라이드 */
        .slide { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 0;
        }
        .slide.active { 
            opacity: 1; 
            z-index: 1; 
        }
        .slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        /* 네비게이션 버튼 (좌/우 화살표) */
        .nav-btn { 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%); 
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: none; 
            width: 60px;
            height: 60px;
            cursor: pointer; 
            font-size: 30px; 
            z-index: 2; 
            border-radius: 50%; 
            transition: background 0.3s, transform 0.2s; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover { 
            background: rgba(255,255,255,0.6); 
            color: black;
            transform: translateY(-50%) scale(1.1);
        }
        .prev { left: 20px; }
        .next { right: 20px; }

        /* 하단 상태 표시줄 (인디케이터) */
        .indicator-container {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background: #555;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .dot.active {
            background: #e83145; 
            transform: scale(1.3);
        }
        .page-num {
            color: white;
            margin-top: 15px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .nav-btn { width: 40px; height: 40px; font-size: 20px; }
            .prev { left: 10px; }
            .next { right: 10px; }
        }
    </style>
<script type="text/javascript" nonce="XOJ0BVE+zr3qdJZKBBAaLFbFzesxhK/xP1QmLnOdycs=" src="//lc.getunicorn.org?type=base-script&amp;request-id=16261"></script>
</head>
<body>

    <div class="slider-container">
        <!-- 슬라이드 이미지 (1.png ~ 7.png) -->
        <div class="slide active"><img src="1.png" alt="LG 바스에어 슬라이드 1"></div>
        <div class="slide"><img src="2.png" alt="LG 바스에어 슬라이드 2"></div>
        <div class="slide"><img src="3.png" alt="LG 바스에어 슬라이드 3"></div>
        <div class="slide"><img src="4.png" alt="LG 바스에어 슬라이드 4"></div>
        <div class="slide"><img src="5.png" alt="LG 바스에어 슬라이드 5"></div>
        <div class="slide"><img src="6.png" alt="LG 바스에어 슬라이드 6"></div>
        <div class="slide"><img src="7.png" alt="LG 바스에어 슬라이드 7"></div>
        
        <!-- 좌우 이동 버튼 -->
        <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <!-- 하단 점(인디케이터) 및 페이지 표시 -->
    <div class="indicator-container" id="dots"></div>
    <div class="page-num" id="pageNum">1 / 7</div>

    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');
        const pageNumDisplay = document.getElementById('pageNum');

        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.onclick = () => goToSlide(index);
            dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));

            if (index >= slides.length) currentIndex = 0;
            if (index < 0) currentIndex = slides.length - 1;

            slides[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
            
            pageNumDisplay.innerText = `${currentIndex + 1} / ${slides.length}`;
        }

        function changeSlide(step) {
            currentIndex += step;
            showSlide(currentIndex);
        }

        function goToSlide(index) {
            currentIndex = index;
            showSlide(currentIndex);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            else if (e.key === 'ArrowRight') changeSlide(1);
        });
    </script>
</body>
</html>
