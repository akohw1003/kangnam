<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG 바스에어 시스템 - 맞춤 제안</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* 전체 화면 스크롤 방지 및 라이트 테마 기본 색상 */
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background-color: #f4f5f7; color: #333; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 1. 최상단 헤더 (로고 및 모드 전환만 존재) */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px; border-bottom: 1px solid #e5e5e5; background: #ffffff; z-index: 100; min-height: 60px; }
        .logo { font-size: 20px; font-weight: 900; color: #a50034; letter-spacing: -0.5px; }
        
        .mode-switch { display: flex; background: #f0f1f4; padding: 4px; border-radius: 8px; }
        .mode-btn { padding: 6px 16px; border: none; background: transparent; color: #666; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 14px; transition: all 0.2s; }
        .mode-btn.active { background: #ffffff; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        
        /* 2. 서브 헤더 (대분류 + 소분류 한 줄 배치) */
        .sub-header-container { display: none; align-items: center; justify-content: center; background: #ffffff; border-bottom: 1px solid #eaeaea; padding: 12px 20px; gap: 16px; z-index: 99; min-height: 56px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .sub-header-container.active { display: flex; }
        
        /* 대분류 스타일 (첨부 이미지 디자인 적용) */
        .main-category-tabs { display: flex; align-items: center; gap: 4px; }
        .cat-btn { padding: 10px 18px; border: none; background: transparent; cursor: pointer; border-radius: 8px; font-weight: 600; font-size: 15px; color: #666; transition: all 0.2s; letter-spacing: -0.3px; }
        .cat-btn:hover { color: #333; }
        .cat-btn.active { background: #fdf0f3; color: #a50034; font-weight: 700; }
        
        /* 대분류 - 소분류 사이 구분선 */
        .divider { width: 1px; height: 20px; background-color: #ddd; display: none; }
        .divider.active { display: block; }
        
        /* 소분류 탭 */
        .sub-category-tabs { display: none; align-items: center; gap: 8px; }
        .sub-category-tabs.active { display: flex; }
        .sub-btn { padding: 8px 16px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 20px; font-size: 13px; font-weight: 600; color: #666; transition: 0.2s; }
        .sub-btn:hover { background: #f9f9f9; }
        .sub-btn.active { border-color: #444; background: #444; color: #fff; }
        
        /* 3. 메인 콘텐츠 (슬라이더 영역) */
        .part-container { display: none; flex: 1; flex-direction: column; height: 100%; position: relative; }
        .part-container.active { display: flex; }
        
        .slider-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f8f9fa; overflow: hidden; }
        
        .slide-group { display: none; width: 100%; height: 100%; position: relative; }
        .slide-group.active { display: block; }
        
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease-in-out; display: flex; align-items: center; justify-content: center; }
        .slide.active { opacity: 1; z-index: 10; }
        
        .slide img { width: 100%; height: 100%; object-fit: contain; }

        /* 이동 버튼 */
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.15); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 20; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: #a50034; }
        .prev-btn { left: 24px; }
        .next-btn { right: 24px; }
        
        /* 카운터 */
        .slide-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 20; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- 1. 최상단 헤더 -->
    <header class="header">
        <div class="logo">LG 바스에어 시스템</div>
        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('part1', this)">제품 설명 (1~7p)</button>
            <button class="mode-btn" onclick="switchMode('part2', this)">맞춤 설치 사례 (8p~)</button>
        </div>
    </header>

    <!-- 2. 서브 헤더 (Part 2 선택 시 노출 / 대분류 + 소분류 나란히 배치) -->
    <div class="sub-header-container" id="sub-header">
        <!-- 대분류 -->
        <div class="main-category-tabs">
            <button class="cat-btn active" onclick="selectCategory('cat1', this)">욕실 중앙 外 설치</button>
            <button class="cat-btn" onclick="selectCategory('cat2', this)">아치형 천장</button>
            <button class="cat-btn" onclick="selectCategory('cat3', this)">기존 환풍기 위치</button>
            <button class="cat-btn" onclick="selectCategory('cat4', this)">창문 있는 화장실</button>
        </div>

        <!-- 구분선 (Cat 1 선택 시 활성화) -->
        <div class="divider active" id="cat-divider"></div>

        <!-- 소분류 (Cat 1 전용) -->
        <div class="sub-category-tabs active" id="sub-cat1">
            <button class="sub-btn active" onclick="selectSubCategory('group-cat1-sub1', this)">일반</button>
            <button class="sub-btn" onclick="selectSubCategory('group-cat1-sub2', this)">욕조 위</button>
            <button class="sub-btn" onclick="selectSubCategory('group-cat1-sub3', this)">샤워부스 위</button>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 (Part 1) -->
    <main id="part1" class="part-container active">
        <div class="slider-wrapper">
            <div id="group-part1" class="slide-group active"></div>
            
            <button class="nav-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
            <button class="nav-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
            <div class="slide-counter" id="counter-part1"></div>
        </div>
    </main>

    <!-- 3. 메인 콘텐츠 (Part 2) -->
    <main id="part2" class="part-container">
        <div class="slider-wrapper">
            <!-- 슬라이드 그룹들 -->
            <div id="group-cat1-sub1" class="slide-group active"></div>
            <div id="group-cat1-sub2" class="slide-group"></div>
            <div id="group-cat1-sub3" class="slide-group"></div>
            <div id="group-cat2" class="slide-group"></div>
            <div id="group-cat3" class="slide-group"></div>
            <div id="group-cat4" class="slide-group"></div>

            <button class="nav-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
            <button class="nav-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
            <div class="slide-counter" id="counter-part2"></div>
        </div>
    </main>

<script>
    // 깃허브 호스팅용 동일 경로
    const folderPath = "./"; 
    
    // 슬라이드 번호 매핑
    const slideData = {
        'group-part1': Array.from({length: 7}, (_, i) => i + 1),               // 1~7
        'group-cat1-sub1': Array.from({length: 10}, (_, i) => i + 8),          // 8~17 (일반)
        'group-cat1-sub2': Array.from({length: 4}, (_, i) => i + 18),          // 18~21 (욕조 위)
        'group-cat1-sub3': Array.from({length: 3}, (_, i) => i + 22),          // 22~24 (샤워부스 위)
        'group-cat2': Array.from({length: 11}, (_, i) => i + 25),              // 25~35 (아치형 천장)
        'group-cat3': Array.from({length: 6}, (_, i) => i + 36),               // 36~41 (기존 환풍기)
        'group-cat4': Array.from({length: 15}, (_, i) => i + 42)               // 42~56 (창문 있는 화장실)
    };

    // DOM 동적 생성
    for (const [groupId, slideNumbers] of Object.entries(slideData)) {
        const container = document.getElementById(groupId);
        if (container) {
            slideNumbers.forEach((num, index) => {
                const isActive = index === 0 ? 'active' : '';
                container.innerHTML += `
                    <div class="slide ${isActive}">
                        <img src="${folderPath}슬라이드${num}.JPG" 
                             alt="슬라이드 ${num}" 
                             loading="lazy"
                             onerror="this.onerror=null; this.src='https://via.placeholder.com/1200x675/e5e5e5/666666?text=Image+Not+Found+(${num}.JPG)';">
                    </div>`;
            });
        }
    }

    let currentMode = 'part1';
    let activeGroupId = 'group-part1';

    // 슬라이드 카운터 및 뷰 갱신
    function updateSlider() {
        const group = document.getElementById(activeGroupId);
        if(!group) return;
        
        const slides = group.querySelectorAll('.slide');
        if(slides.length === 0) return;

        let activeIndex = 0;
        slides.forEach((slide, index) => {
            if(slide.classList.contains('active')) activeIndex = index;
            slide.classList.remove('active');
        });
        
        slides[activeIndex].classList.add('active');
        
        const counterId = currentMode === 'part1' ? 'counter-part1' : 'counter-part2';
        document.getElementById(counterId).innerText = `${activeIndex + 1} / ${slides.length}`;
    }

    // 슬라이드 이동
    function moveSlide(direction) {
        const group = document.getElementById(activeGroupId);
        const slides = group.querySelectorAll('.slide');
        if(slides.length <= 1) return;

        let activeIndex = 0;
        slides.forEach((slide, index) => {
            if(slide.classList.contains('active')) activeIndex = index;
            slide.classList.remove('active');
        });

        activeIndex += direction;
        
        if(activeIndex >= slides.length) activeIndex = 0;
        if(activeIndex < 0) activeIndex = slides.length - 1;
        
        slides[activeIndex].classList.add('active');
        updateSlider();
    }

    // 상단 모드 전환 (제품설명 vs 맞춤설치)
    function switchMode(mode, btnElement) {
        currentMode = mode;
        
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');
        
        document.querySelectorAll('.part-container').forEach(part => part.classList.remove('active'));
        document.getElementById(mode).classList.add('active');
        
        const subHeader = document.getElementById('sub-header');

        if(mode === 'part1') {
            activeGroupId = 'group-part1';
            subHeader.classList.remove('active');
            updateSlider();
        } else {
            subHeader.classList.add('active');
            // Part2 진입 시 현재 활성화된 대분류 클릭 이벤트 강제 실행
            const activeCat = document.querySelector('.main-category-tabs .cat-btn.active');
            if(activeCat) activeCat.click();
        }
    }

    // 대분류 선택 로직 (소분류 유무에 따른 노출 처리)
    function selectCategory(catId, btnElement) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');
        
        const divider = document.getElementById('cat-divider');
        const subCatContainer = document.getElementById('sub-cat1');

        if(catId === 'cat1') {
            // 소분류 및 구분선 노출
            divider.classList.add('active');
            subCatContainer.classList.add('active');
            
            // 기존에 활성화된 소분류가 있으면 유지, 없으면 첫번째 소분류 클릭
            const activeSubBtn = subCatContainer.querySelector('.sub-btn.active');
            if(activeSubBtn) activeSubBtn.click();
            else subCatContainer.querySelector('.sub-btn').click();
        } else {
            // 소분류 및 구분선 숨김
            divider.classList.remove('active');
            subCatContainer.classList.remove('active');
            
            document.querySelectorAll('#part2 .slide-group').forEach(group => group.classList.remove('active'));
            const targetGroupId = 'group-' + catId;
            document.getElementById(targetGroupId).classList.add('active');
            
            activeGroupId = targetGroupId;
            
            // 첫번째 슬라이드로 초기화
            const slides = document.getElementById(targetGroupId).querySelectorAll('.slide');
            slides.forEach(s => s.classList.remove('active'));
            if(slides.length > 0) slides[0].classList.add('active');
            
            updateSlider();
        }
    }

    // 소분류 선택 로직 (Cat1 전용)
    function selectSubCategory(groupId, btnElement) {
        const parent = btnElement.parentElement;
        parent.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        document.querySelectorAll('#part2 .slide-group').forEach(group => group.classList.remove('active'));
        document.getElementById(groupId).classList.add('active');
        
        activeGroupId = groupId;
        
        // 첫번째 슬라이드로 초기화
        const slides = document.getElementById(groupId).querySelectorAll('.slide');
        slides.forEach(s => s.classList.remove('active'));
        if(slides.length > 0) slides[0].classList.add('active');
        
        updateSlider();
    }

    // 키보드 방향키 이동 지원
    document.addEventListener('keydown', (e) => {
        if(e.key === 'ArrowRight') moveSlide(1);
        if(e.key === 'ArrowLeft') moveSlide(-1);
    });

    // 초기 로딩
    updateSlider();
</script>

</body>
</html>
